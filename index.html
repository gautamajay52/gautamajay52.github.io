<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Gautam Kumar — personal site. Still struggling a.t.m." />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <title>Gautam Kumar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <canvas id="net" aria-hidden="true"></canvas>
    <div class="veil" aria-hidden="true"></div>

    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch light / dark theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>

    <main>
      <header class="hero">
        <div class="wrap">
          <div class="hero-grid">
            <div>
              <h1>Gautam<br /> <span class="thin">Kumar</span></h1>
              <div class="quote-block">
                <p class="type-line"><span id="typer">The best way to predict the future is to invent it.</span><span class="caret" aria-hidden="true"></span></p>
                <p class="quote-author show" id="quoteAuthor">— Alan Kay</p>
              </div>

              <nav class="socials" aria-label="Gautam on the web">
                <a href="https://twitter.com/gautamajay52" target="_blank" rel="noopener">
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117l11.966 15.644z"/></svg>
                  Twitter
                </a>
                <a href="https://github.com/gautamajay52" target="_blank" rel="noopener">
                  <svg class="gh-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                  GitHub
                </a>
                <a href="https://telegram.dog/gautamajay52" target="_blank" rel="noopener">
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.4 18.8 19c-.23 1.03-.85 1.28-1.72.8l-4.76-3.51-2.3 2.21c-.25.26-.47.47-.96.47l.35-4.91 8.94-8.08c.39-.35-.08-.54-.6-.19L6.7 13.1 1.94 11.61c-1.03-.32-1.05-1.03.22-1.53L20.63 2.9c.86-.32 1.61.2 1.27 1.5z"/></svg>
                  Telegram
                </a>
              </nav>
            </div>

            <div class="hero-visual">
              <div class="avatar-tilt" id="tilt">
                <div class="avatar-ring" id="avatarRing" role="button" tabindex="0" aria-label="Rotate the profile photo">
                  <img src="assets/img/avatar.jpg" alt="Portrait placeholder for Gautam Kumar" width="640" height="640" />
                  <span class="orbit-tag t2" id="profileTag" aria-label="STILL STRUGGLING a.t.m"><span class="big">S</span>TILL <span class="big">S</span>TRUGGLIN<span class="big">G</span><sup>a.t.m</sup></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <footer>
        <div class="wrap footer-inner">
          <p class="footer-copy">© 2026 Gautam Kumar</p>
          <nav class="footer-links" aria-label="Footer">
            <a href="https://gogautam.win">gogautam.win</a>
          </nav>
        </div>
      </footer>
    </main>

    <!-- Roamer artwork: the cat lives here as a template;
         the script clones it (and its own dog / rabbit / fox / car /
         truck / motorbike art) into live roamers in #roamers below -->
    <template id="catArt">
      <div class="cat-inner">
        <svg class="cat-side" viewBox="0 0 120 72" fill="none" aria-hidden="true">
          <!-- tail -->
          <path class="tail" d="M14 44 C2 40 1 26 8 18 C11 14 17 15 16 20 C15 27 16 33 22 37 Z" fill="#e8862e"/>
          <!-- back legs -->
          <g class="leg leg-b"><path d="M30 50 L26 68 L33 68 L36 52 Z" fill="#c96a1b"/></g>
          <g class="leg leg-a"><path d="M42 52 L40 69 L47 69 L47 53 Z" fill="#e8862e"/></g>
          <!-- body -->
          <path d="M22 34 C22 24 32 18 48 18 L76 18 C90 18 98 25 98 34 C98 45 90 52 76 52 L46 52 C31 52 22 45 22 34 Z" fill="#f59a3c"/>
          <!-- stripes -->
          <path d="M44 19 L41 29 M58 18 L55 28 M71 19 L69 29" stroke="#c96a1b" stroke-width="4" stroke-linecap="round"/>
          <path d="M27 40 L36 40 M28 46 L37 46" stroke="#c96a1b" stroke-width="3.4" stroke-linecap="round"/>
          <!-- front legs -->
          <g class="leg leg-a"><path d="M80 50 L78 68 L85 68 L86 52 Z" fill="#c96a1b"/></g>
          <g class="leg leg-b"><path d="M91 48 L93 67 L100 67 L96 50 Z" fill="#f59a3c"/></g>
          <!-- head -->
          <g class="head">
            <path d="M88 6 L95 16 L85 18 Z" fill="#f59a3c"/>
            <path d="M106 5 L110 16 L100 17 Z" fill="#f59a3c"/>
            <path d="M89 9 L93 15 L87 16 Z M105 9 L107 15 L101 16 Z" fill="#f6c177"/>
            <circle cx="99" cy="27" r="15" fill="#f59a3c"/>
            <path d="M92 16 L91 23 M103 15 L103 22" stroke="#c96a1b" stroke-width="3" stroke-linecap="round"/>
            <circle cx="94" cy="27" r="2.1" fill="#1d130a"/>
            <circle cx="106" cy="27" r="2.1" fill="#1d130a"/>
            <path d="M111 32 L114 31 L111 35 Z" fill="#e56b6f"/>
            <path d="M112 37 C109 39 106 39 104 37" stroke="#8a4b12" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M112 30 L119 28 M112 34 L119 35" stroke="#f3e9dc" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
          </g>
        </svg>
        <!-- Front view: the cat turns to face you while it rests -->
        <svg class="cat-front" viewBox="0 0 120 72" fill="none" aria-hidden="true">
          <!-- tail curled around the side, tip flicks while resting -->
          <path class="front-tail" d="M88 62 C102 62 108 54 104 46 C102 42 96 43 97 48 C98 54 94 58 86 58 Z" fill="#e8862e"/>
          <g class="front-breathe">
            <!-- body -->
            <path d="M60 34 C76 34 86 46 86 58 C86 66 80 70 60 70 C40 70 34 66 34 58 C34 46 44 34 60 34 Z" fill="#f59a3c"/>
            <!-- chest -->
            <path d="M60 44 C67 44 71 50 71 58 C71 64 67 68 60 68 C53 68 49 64 49 58 C49 50 53 44 60 44 Z" fill="#fbd9ae"/>
            <!-- front paws -->
            <path d="M46 70 L46 62 C46 59 52 59 52 62 L52 70 Z" fill="#e8862e"/>
            <path d="M68 70 L68 62 C68 59 74 59 74 62 L74 70 Z" fill="#e8862e"/>
            <path d="M49 64 L49 68 M71 64 L71 68" stroke="#c96a1b" stroke-width="1.6" stroke-linecap="round"/>
          </g>
          <g class="front-head">
            <!-- ears -->
            <path class="ear ear-l" d="M42 16 L46 4 L58 10 Z" fill="#f59a3c"/>
            <path class="ear ear-r" d="M78 16 L74 4 L62 10 Z" fill="#f59a3c"/>
            <path d="M45 13 L47 7 L54 10 Z" fill="#f6c177"/>
            <path d="M75 13 L73 7 L66 10 Z" fill="#f6c177"/>
            <!-- head -->
            <circle cx="60" cy="26" r="19" fill="#f59a3c"/>
            <!-- forehead stripes -->
            <path d="M52 9 L52 15 M60 8 L60 14 M68 9 L68 15" stroke="#c96a1b" stroke-width="3" stroke-linecap="round"/>
            <!-- eyes (they blink while it rests) -->
            <g class="eye"><ellipse cx="52" cy="26" rx="2.6" ry="3.4" fill="#1d130a"/><circle cx="53" cy="24.8" r="0.9" fill="#ffffff" opacity="0.85"/></g>
            <g class="eye"><ellipse cx="68" cy="26" rx="2.6" ry="3.4" fill="#1d130a"/><circle cx="69" cy="24.8" r="0.9" fill="#ffffff" opacity="0.85"/></g>
            <!-- nose + mouth -->
            <path d="M57.5 32.5 L62.5 32.5 L60 35.5 Z" fill="#e56b6f"/>
            <path d="M60 35.5 C60 38 57 39 55 37.5 M60 35.5 C60 38 63 39 65 37.5" stroke="#8a4b12" stroke-width="1.7" stroke-linecap="round"/>
            <!-- whiskers -->
            <path d="M44 31 L33 29 M44 35 L34 36 M76 31 L87 29 M76 35 L86 36" stroke="#f3e9dc" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
          </g>
        </svg>
      </div>
    </template>
    <div id="roamers" aria-hidden="true"></div>

    <script src="assets/js/main.js"></script>
  </body>
</html>
